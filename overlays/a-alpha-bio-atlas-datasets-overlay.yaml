actions:
- target: $.info
  description: >-
    Add a description, contact and provenance to an info block that carried only a title and a 0.0.x build number.
  update:
    description: >-
      The HTTP API behind Atlas, A-Alpha Bio's protein-protein interaction data platform. Nine read operations over
      Atlas "Data Blocks" — versioned datasets of quantitative binding measurements produced on the AlphaSeq
      yeast-mating platform. Dataset discovery, dataset metadata and structured Data Cards answer anonymously; CSV
      data, CSV schemas and structure (.cif) files require an HTTP bearer token obtained through Atlas sign-in.
    contact:
      name: A-Alpha Bio
      url: https://www.aalphabio.com/contact/
    x-api-evangelist:
      profile: https://github.com/api-evangelist/a-alpha-bio
      harvested: '2026-08-06'
      harvested_from: https://api.atlas.aalphabio.com/openapi.json
- target: $
  description: >-
    Declare the production server. The harvested document ships no servers[] at all, so a generated client has no base
    URL. The host below is the one that serves this very specification and every /api/v1 path, and is named in the
    preconnect hint of the Atlas SPA shell at https://atlas.aalphabio.com/.
  update:
    servers:
    - url: https://api.atlas.aalphabio.com
      description: Atlas Data Product API production host
- target: $
  description: >-
    Declare the single tag used by every operation. The harvested document tags all nine operations "Datasets" but
    never declares the tag, so no description reaches a docs renderer.
  update:
    tags:
    - name: Datasets
      description: >-
        Atlas Data Blocks — dataset discovery, metadata, Data Cards, CSV data, CSV schema and structure (.cif) files.
- target: $.paths['/api/v1/datasets'].get
  description: >-
    Record the observed anonymous-access behaviour. This is the single most consequential undocumented fact about the
    API: with the default flags an unauthenticated caller receives an EMPTY objects array, and the public licensable
    catalogue only appears when include_locked=true is set.
  update:
    x-anonymous-access: true
    x-anonymous-note: >-
      Verified 2026-08-06 — returns 200 with no Authorization header. With default flags the result is
      {"objects":[]}. Pass include_locked=true (and include_coming_soon=true for teasers) to retrieve the public
      catalogue; 16 records were returned on that date.
    x-evidence:
      url: https://api.atlas.aalphabio.com/api/v1/datasets?include_locked=true&include_coming_soon=true
      http_status: 200
      fetched: '2026-08-06'
      example_file: examples/a-alpha-bio-list-datasets-response.json
