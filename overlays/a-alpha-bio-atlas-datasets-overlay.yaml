- target: $.components.securitySchemes.HTTPBearer
  description: >-
    Name the token issuer. The harvested scheme says only "http/bearer", which tells a developer nothing about how to
    obtain one.
  update:
    bearerFormat: JWT
    description: >-
      AWS Cognito access token. Obtained through the Cognito hosted-UI authorization-code flow that the Atlas web
      client runs (scopes openid, email, profile, aws.cognito.signin.user.admin), or through the browser-assisted
      login-code flow at https://atlas.aalphabio.com/cli-login for the Atlas CLI client.
    x-source: https://atlas.aalphabio.com/assets/App-DfcS_Q-d.js
