aid: a-alpha-bio
name: A-Alpha Bio
description: >-
  A-Alpha Bio is a Seattle biotechnology company, founded in 2017 out of the University of Washington's Institute for
  Protein Design and Center for Synthetic Biology, that measures, predicts and engineers protein-protein interactions.
  Its experimental platform AlphaSeq reprograms yeast mating to quantify millions of protein-protein binding affinities
  in a single experiment, and its computational platform AlphaBind is a domain-specific deep-learning model trained on
  hundreds of millions of those affinity measurements to predict and optimize antibody-antigen binding from sequence. In
  July 2026 the company launched Atlas, a web platform and data ecosystem that publishes ML-ready protein interaction
  "Data Blocks" for licensing, custom on-demand data generation, and a quarterly-release Atlas Consortium whose founding
  members include GSK, Boltz, Cradle and Dyno Therapeutics. Atlas is backed by a public HTTP API — the Data Product API
  at api.atlas.aalphabio.com — which serves dataset discovery, dataset metadata and structured Data Cards anonymously,
  and gates CSV data, CSV schemas and structure (.cif) files behind a bearer token issued through AWS Cognito sign-in.
