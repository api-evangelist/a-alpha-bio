- from: Datacard
  to: MlCardContentResponse
  type: has_one
  via: ml
- from: Datacard
  to: BioCardContent
  type: has_one
  via: bio
- from: MlCardContentResponse
  to: CardContentSchemaColumn
  type: has_many
  via: schema_columns[] (sourced from S3 at request time, never persisted)
- from: BioCardContent
  to: CardContentFigure
  type: has_many
  via: figures[]
enumerations:
- name: ProductKind
  field: DatasetItem.product_kind
  values:
  - value: open-source
    meaning: Bypasses license and subscription checks entirely.
  - value: consortium
    meaning: >-
      Gated behind a product-scoped subscription with the product release date as the subscriber gate; per-block
      license rows grant perpetual access.
  - value: licensable
    meaning: No subscription path — access requires a license row. Any number of companies may be licensed.
  - value: exclusive
    meaning: >-
      No subscription path and licensing restricted to a single company (the dataset's designer). Exclusive blocks
      are always hidden from non-licensees regardless of the public-metadata flag.
  note: >-
    This enum is the commercial model of the whole Atlas business rendered as an API field — it is the most
    information-dense thing in the specification.
- name: status
  field: DatasetItem.status
  values: [draft, pending_review, published, retracted]
- name: mode
  field: DataMode.name
  values_observed: [source, ml]
  note: Not enumerated in the schema — free-form string, discovered per dataset from `modes[]`.
