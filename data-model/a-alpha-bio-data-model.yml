  type: has_one
  via: 'GET /api/v1/datasets/{id}/schema (per mode)'
- from: Dataset
  to: StructureFile
  type: has_many
  via: 'GET /api/v1/datasets/{id}/structures'
- from: Dataset
  to: Figure
  type: has_many
  via: CardContentFigure.filenames referenced from the Data Card, fetched per tab
- from: Datacard
