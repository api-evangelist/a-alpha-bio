tools:
- name: list_datasets
  description: >-
    List Atlas Data Blocks. Set include_locked=true to see the public licensable catalogue (with defaults, an
    unauthenticated caller gets an empty list).
  rest: listDatasets
  http: GET /api/v1/datasets
  auth_required: false
  inputSchema_source: openapi#/paths/~1api~1v1~1datasets/get/parameters
- name: get_dataset
  description: Get metadata for one Atlas Data Block, optionally at a pinned version.
  rest: getDataset
  http: GET /api/v1/datasets/{id}
  auth_required: false
  inputSchema_source: openapi#/paths/~1api~1v1~1datasets~1{id}/get/parameters
- name: get_dataset_datacard
  description: >-
    Get the structured Data Card for a Data Block — executive summary, ML guidance (noise/signal, recommended splits,
    data views, column schema) and biology/assay context.
  rest: getDatasetDatacard
  http: GET /api/v1/datasets/{id}/datacard
  auth_required: false
  inputSchema_source: openapi#/paths/~1api~1v1~1datasets~1{id}~1datacard/get/parameters
- name: get_dataset_data
  description: Get a pre-signed URL for a Data Block's CSV, optionally row-limited and mode-selected.
  rest: getDatasetData
  http: GET /api/v1/datasets/{id}/data
  auth_required: true
  inputSchema_source: openapi#/paths/~1api~1v1~1datasets~1{id}~1data/get/parameters
  note: Use redirect=false so the tool returns a URL as JSON rather than following a 302.
- name: get_dataset_schema
  description: Get the CSV column schema for a Data Block, shaped to unpack into pd.read_csv(url, **schema).
  rest: getDatasetSchema
  http: GET /api/v1/datasets/{id}/schema
  auth_required: true
  inputSchema_source: openapi#/paths/~1api~1v1~1datasets~1{id}~1schema/get/parameters
- name: list_dataset_structures
  description: List the structure (.cif) files attached to a Data Block.
  rest: listDatasetStructures
  http: GET /api/v1/datasets/{id}/structures
  auth_required: true
  inputSchema_source: openapi#/paths/~1api~1v1~1datasets~1{id}~1structures/get/parameters
- name: download_dataset_structures
  description: Get a pre-signed URL for a zip archive of all of a Data Block's structure files.
  rest: downloadDatasetStructures
  http: GET /api/v1/datasets/{id}/structures/download
  auth_required: true
  inputSchema_source: openapi#/paths/~1api~1v1~1datasets~1{id}~1structures~1download/get/parameters
- name: get_dataset_structure
  description: Get the content of one structure file from a Data Block.
  rest: getDatasetStructure
  http: GET /api/v1/datasets/{id}/structures/{filename}
  auth_required: true
  inputSchema_source: openapi#/paths/~1api~1v1~1datasets~1{id}~1structures~1{filename}/get/parameters
- name: get_dataset_figure
  description: Get a figure image referenced by a Data Block's Data Card, scoped to a card tab.
